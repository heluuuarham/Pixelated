    <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />
    <title>Pixelated — Wall Art Prints</title>
    <script>
      // No-flash theme init: apply stored or system preference before paint.
      (function () {
        try {
          var stored = localStorage.getItem('sf_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          var icon = dark ? '/image-removebg-preview.png' : '/image__1_-removebg-preview.png';
          ['favicon-main', 'favicon-shortcut', 'favicon-apple'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.href = icon;
          });
        } catch (e) {}
      })();
    </script>
